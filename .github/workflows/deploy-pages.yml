name: Deploy to GitHub Pages

# Pages hosts a single site per repo, so every run publishes both branches together:
#   main    -> https://<user>.github.io/ASHY/          (official)
#   develop -> https://<user>.github.io/ASHY/develop/  (preview, noindex)
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - id: develop
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" develop > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.develop.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Build main
        working-directory: main
        run: npm ci && npm run build

      - name: Build develop
        if: steps.develop.outputs.exists == 'true'
        working-directory: develop
        run: npm ci && npm run build

      - name: Assemble site
        run: |
          mkdir site
          cp -r main/dist/. site/
          if [ -d develop/dist ]; then
            mkdir site/develop
            cp -r develop/dist/. site/develop/
            sed -i \
              -e 's|<head>|<head>\n    <meta name="robots" content="noindex" />|' \
              -e 's|<title>|<title>[develop] |' \
              site/develop/index.html
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
